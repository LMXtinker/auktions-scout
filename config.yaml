# Auktions-Scout Konfiguration
# adapter: tb (Troostwijk/Surplex-API), aurena (Suchseite + Klick), sonst generisch.
# Generisch: search_url mit {q}, sonst Suchfeld auf der Startseite. lot_pattern = Regex für echte Los-Links.

sites:
  - name: aurena
    adapter: aurena
  - name: troostwijk-surplex
    adapter: tb
    platforms: [TWK, SPX]
  - name: zoll-auktion
    home: https://www.zoll-auktion.de/
    search_url: https://www.zoll-auktion.de/auktion/auktionsuebersicht.php?n2={q}&n1%5B%5D=0&n0=search
    lot_pattern: /auktion/produkt/
  - name: justiz-auktion
    home: https://www.justiz-auktion.de/
    lot_pattern: justiz-auktion\.de/[^/?#]+-\d{5,}$

keywords:
  - RTX 4090
  - RTX 4080
  - RTX 4070
  - RTX 5090
  - RTX 5080
  - RTX 5070
  - RTX A6000
  - Grafikkarte
  - Workstation
  - Gaming PC
  - Laserprojektor
  - Beamer
  - Projektor
  - LED Wand
  - LED Wall
  - Blackmagic
  - Medienserver
  - Veranstaltungstechnik
  - Lichtpult
  - Moving Head
  - Traverse

scrolls: 3
max_cards: 60

# Telegram-Digest (scout/digest.py, Workflow digest.yml)
digest:
  send_at: "07:45"     # Wiener Zeit
  batch_size: 120      # Lose pro Gemini-Aufruf
  chat_id: "1232834463"  # Telegram-Empfänger (Secret TELEGRAM_CHAT_ID hat Vorrang); ohne Bot-Token nutzlos

# RTX-5090-Wächter (scout/gpu.py, Workflow gpu.yml) – meldet neue Angebote sofort per Telegram
gpu_hunt:
  query: "RTX 5090"
  sources: [willhaben, kleinanzeigen, troostwijk, aurena, zoll]
  must: '5090'                     # muss im Titel/Text vorkommen
  # Titel mit diesen Wörtern werden ignoriert (Gesuche, Ankauf, Laptops, Zubehör, defekt)
  exclude: '\b(suche|gesucht|ankauf|wir kaufen|kaufe|tausch\w*|defekt|bastler|laptop|notebook|\d{3,5}hx|blade 1\d|predator|legion|zephyrus|scar|titan|raider|stealth|alienware|vector|crosshair|omen|rog flow|wasserk[üu]hl\w*|waterblock|wasserblock|k[üu]hler|backplate|halterung|kabel|adapter|stecker|netzteil|riser)\b'
  min_price: 900                   # Kleinanzeigen darunter = Zubehör/Fake
  deal_price: 4500                 # Grafikkarten bis zu diesem Preis 🔥 markieren (Komplett-PCs nie)
  first_run_top: 15
