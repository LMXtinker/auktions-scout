# Auktions-Scout Konfiguration
# adapter: tb (Troostwijk/Surplex-API), aurena (Suchseite + Klick), sonst generisch.
# Generisch: search_url mit {q}, sonst Suchfeld auf der Startseite. lot_pattern = Regex für echte Los-Links.

sites:
  - name: aurena
    adapter: aurena
  - name: troostwijk-surplex
    adapter: tb
    platforms: [TWK, SPX]
  - name: zoll-auktion
    home: https://www.zoll-auktion.de/
    search_url: https://www.zoll-auktion.de/auktion/auktionsuebersicht.php?n2={q}&n1%5B%5D=0&n0=search
    lot_pattern: /auktion/produkt/
  - name: justiz-auktion
    home: https://www.justiz-auktion.de/
    lot_pattern: justiz-auktion\.de/[^/?#]+-\d{5,}$

keywords:
  - RTX 4090
  - RTX 4080
  - RTX 4070
  - RTX 5090
  - RTX 5080
  - RTX 5070
  - RTX A6000
  - Grafikkarte
  - Workstation
  - Gaming PC
  - Laserprojektor
  - Beamer
  - Projektor
  - LED Wand
  - LED Wall
  - Blackmagic
  - Medienserver
  - Veranstaltungstechnik
  - Lichtpult
  - Moving Head
  - Traverse

scrolls: 3
max_cards: 60

# Telegram-Digest (scout/digest.py, Workflow digest.yml)
digest:
  send_at: "07:45"     # Wiener Zeit
  batch_size: 120      # Lose pro Gemini-Aufruf
  chat_id: "1232834463"  # Telegram-Empfänger (Secret TELEGRAM_CHAT_ID hat Vorrang); ohne Bot-Token nutzlos

# RTX-5090-Wächter (scout/gpu.py, Workflow gpu.yml) – meldet neue Angebote sofort per Telegram
gpu_hunt:
  query: "RTX 5090"
  sources: [willhaben, kleinanzeigen, troostwijk, aurena, zoll, alternate_at, alternate_de, caseking]
  retail_tolerance: 0.05           # Neuware melden bis Gebraucht-Median + 5 %
  must: '5090'                     # muss im Titel/Text vorkommen
  # Titel mit diesen Wörtern werden ignoriert (Gesuche, Ankauf, Laptops, Zubehör, defekt)
  exclude: '\b(suche|gesucht|ankauf|wir kaufen|kaufe|tausch\w*|defekt|bastler|laptop|notebook|\d{3,5}hx|blade 1\d|predator|legion|zephyrus|scar|titan|raider|stealth|alienware|vector|crosshair|omen|rog flow|wasserk[üu]hl\w*|waterblock|wasserblock|k[üu]hler|backplate|halterung|kabel|adapter|stecker|netzteil|riser)\b'
  min_price: 900                   # Kleinanzeigen darunter = Zubehör/Fake
  deal_price: 4500                 # Grafikkarten bis zu diesem Preis 🔥 markieren (Komplett-PCs nie)
  first_run_top: 15

# MacBook-Wächter (scout/mac.py, Workflow mac.yml) – Telegram: optional eigener Bot (MAC_TELEGRAM_BOT_TOKEN), sonst Auktions-Scout-Bot
mac_hunt:
  chip: M5              # nur dieser Chip (leer = egal)
  queries: ["macbook air 15 m5 24gb 1tb", "macbook air 15 m5", "macbook air 15 24gb 1tb"]
  shop_queries: ["macbook air 15 m5 24gb 1tb", "macbook air 15 m5"]
  max_geizhals_offers: 0   # Händlerliste je Produkt: geizhals-Produktseiten blocken GitHub (Bot-Check) – aus
  geizhals_queries: ["macbook air 15 m5 24gb 1tb", "macbook air 15 m5 32gb", "macbook air 15 m5 2tb"]
  sources: [willhaben, kleinanzeigen, troostwijk, apple_at, apple_de, geizhals,
            mactrade]
  # amazon, cyberport, mediamarkt, notebooksbilliger, notebook.de blocken GitHub-Server – ihre Preise kommen
  # über die geizhals-Händlerliste (günstigster Shop je Produkt)   # ebay, idealo: blocken GitHub-Server
  # Spezifikation (Regex): mind. 24 GB RAM, mind. 1 TB SSD
  ram: '\b(24|32)\s*gb\b(?!\s*(ssd|speicher|festplatte))|\b(24|32)\s*gb\s*(ram|arbeitsspeicher|unified|memory)'
  ssd: '\b[12]\s*tb\b|\b(1000|1024|2000|2048)\s*gb\b'
  # Titel mit diesen Wörtern werden ignoriert (Gesuche, Zubehör, defekt, gesperrt)
  exclude: '\b(suche|gesucht|ankauf|wir kaufen|kaufe|tausch\w*|defekt\w*|bastler|ersatzteil\w*|gesperrt|icloud[- ]?lock\w*|h[üu]lle|case|sleeve|tasche|folie|schutz\w*|skin|ladeger[äa]t|netzteil|adapter|dock|hub|logicboard|mainboard|display ?(bruch|schaden)|wasserschaden)\b'
  min_price: 600        # darunter = Zubehör/Fake (Auktionen ausgenommen)
  max_price: 3500
  deal_netto: 1600      # 🔥 wenn Nettopreis darunter (privat = Endpreis, Händler = ohne USt.)
  max_details: 40       # Detailseiten pro Lauf für Anzeigen ohne Angaben im Suchergebnis
