name: explore

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs (Leerzeichen-getrennt)"
        required: true

permissions:
  contents: write

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scout/explore.py ${{ github.event.inputs.urls }}
      - run: |
          git config user.name "scout-bot"
          git config user.email "scout-bot@users.noreply.github.com"
          git add debug
          git diff --cached --quiet || git commit -m "explore"
          git pull --rebase --autostash || true
          git push
