name: gpu-watch

on:
  schedule:
    - cron: "7,37 5-21 * * *"   # alle 30 min zwischen ca. 7 und 23 Uhr Wien (GitHub startet oft verspätet)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur Vorschau (nichts senden)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: gpu
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scout/gpu.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
      - name: Zustand committen
        if: always()
        run: |
          git config user.name "scout-bot"
          git config user.email "scout-bot@users.noreply.github.com"
          for f in data/gpu_seen.json data/gpu_status.json debug/gpu_preview.txt; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || git commit -m "gpu: $(date -u +%F\ %H:%M)"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
